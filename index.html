<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LittleXiaoRan</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #07152d;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 6% 0%, #17487755, transparent 48%),
        radial-gradient(ellipse at 92% 22%, #49378226, transparent 48%),
        linear-gradient(145deg, #0b1d3a, #07152d 65%, #0a1833);
      isolation: isolate;
    }

    .stars {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .stars::before,
    .stars::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #bbdfff;
      box-shadow:
        7vw 31vh #bbdfff66, 18vw 62vh #bbdfff44,
        27vw 19vh #bbdfff55, 36vw 83vh #bbdfff66,
        43vw 42vh #bbdfff44, 51vw 12vh #bbdfff55,
        62vw 68vh #bbdfff66, 69vw 29vh #bbdfff44,
        78vw 88vh #bbdfff55, 86vw 48vh #bbdfff66,
        94vw 14vh #bbdfff44, 12vw 91vh #bbdfff55;
      opacity: 0.6;
      animation: drift 18s ease-in-out infinite alternate;
    }

    .stars::after {
      top: 8vh;
      left: 4vw;
      width: 1px;
      height: 1px;
      opacity: 0.35;
      animation-duration: 25s;
      animation-delay: -9s;
    }

    header {
      padding: clamp(28px, 5vw, 64px) clamp(24px, 5vw, 72px);
    }

    h1 {
      position: relative;
      width: fit-content;
      max-width: 100%;
      margin: 0;
      font-size: clamp(28px, 5.5vw, 54px);
      font-weight: 750;
      line-height: 1.2;
      letter-spacing: -0.045em;
      overflow-wrap: anywhere;
      color: #b6dfff;
      background: linear-gradient(110deg, #e0f5ff 5%, #89d9ff 40%, #a9a5ff 75%, #c8afff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 22px #649cff38);
    }

    h1::after {
      content: "";
      position: absolute;
      bottom: -18px;
      left: 2px;
      width: 48px;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, #79d5ff, #9e8aff55, transparent);
      box-shadow: 0 0 12px #79d5ff44;
    }

    @keyframes drift {
      from { transform: translateY(0); }
      to { transform: translateY(-18px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .stars::before,
      .stars::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <header>
    <h1>LittleXiaoRan</h1>
  </header>
</body>
</html>
