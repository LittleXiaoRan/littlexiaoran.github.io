<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b13">
  <title>LittleXiaoRan</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b13;
      --line: rgba(156, 183, 211, 0.16);
      --text: #edf7ff;
      --muted: #8a9bb0;
      --mint: #64fbd2;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; width: 100%; height: 100%; }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      background: radial-gradient(circle at 50% -20%, #14233b 0, var(--bg) 48%, #05070d 100%);
      color: var(--text);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .topbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      padding: 0 clamp(24px, 5vw, 72px);
    }

    .brand { display: flex; flex-direction: column; gap: 2px; }
    .brand strong { font-size: clamp(26px, 3.4vw, 36px); font-weight: 750; letter-spacing: 0.08em; }
    .brand strong span { color: var(--mint); }
    .brand > span { color: #64768d; font-size: 11px; letter-spacing: 0.22em; }

    main {
      padding: 28px clamp(24px, 5vw, 72px) 40px;
    }

    .eyebrow { margin: 0 0 16px; color: var(--mint); font-size: 11px; font-weight: 700; letter-spacing: 0.25em; }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 320px));
      gap: 14px;
      width: 100%;
      justify-content: start;
    }

    .game-card {
      position: relative;
      min-height: 164px;
      padding: 16px;
      border: 1px solid rgba(130, 159, 181, 0.18);
      border-radius: 12px;
      background: rgba(17, 28, 43, 0.92);
      text-align: left;
      transition: transform 160ms ease, border-color 160ms ease;
    }

    .game-card:hover { transform: translateY(-3px); border-color: rgba(100, 251, 210, 0.55); }
    .game-card:focus-visible { outline: 2px solid var(--mint); outline-offset: 4px; }

    .game-swatch {
      display: block;
      width: 100%;
      height: 5px;
      margin-bottom: 13px;
      border-radius: 4px;
      background: var(--swatch, var(--mint));
      box-shadow: 0 0 12px color-mix(in srgb, var(--swatch, var(--mint)) 40%, transparent);
    }

    .game-card strong { display: block; font-size: 18px; letter-spacing: 0.04em; }
    .game-en { display: block; margin-top: 4px; color: #64768d; font-size: 10px; letter-spacing: 0.22em; }
    .game-card p { margin: 10px 0 0; color: #8ba1b4; font-size: 12px; line-height: 1.7; }
    .game-badge { position: absolute; right: 12px; bottom: 10px; color: var(--mint); font-size: 10px; letter-spacing: 0.1em; }

    @media (max-width: 760px) {
      .topbar { min-height: 56px; padding: 0 14px; }
      .brand strong { font-size: 24px; }
      .brand span { display: none; }
      main { padding: 20px 14px 32px; }
      .games { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>Little<span>XiaoRan</span></strong>
      <span>GAME PORTAL</span>
    </div>
  </header>
  <main>
    <p class="eyebrow">GAMES</p>
    <section class="games" aria-label="游戏列表">
      <a class="game-card" href="https://littlexiaoran.github.io/star-ring-breakout/" target="_blank" rel="noopener">
        <span class="game-swatch" aria-hidden="true"></span>
        <strong>星环突围</strong>
        <span class="game-en">STAR RING BREAKOUT</span>
        <p>五波进攻 · 随机强化 · 动态首领</p>
        <span class="game-badge" aria-hidden="true">PLAY ›</span>
      </a>
    </section>
  </main>
</body>
</html>
