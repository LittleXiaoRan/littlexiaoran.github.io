<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LittleXiaoRan</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #07152d;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 6% 0%, #17487755, transparent 48%),
        radial-gradient(ellipse at 92% 22%, #49378226, transparent 48%),
        linear-gradient(145deg, #0b1d3a, #07152d 65%, #0a1833);
      isolation: isolate;
    }

    .stars {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .stars::before,
    .stars::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #bbdfff;
      box-shadow:
        7vw 31vh #bbdfff66, 18vw 62vh #bbdfff44,
        27vw 19vh #bbdfff55, 36vw 83vh #bbdfff66,
        43vw 42vh #bbdfff44, 51vw 12vh #bbdfff55,
        62vw 68vh #bbdfff66, 69vw 29vh #bbdfff44,
        78vw 88vh #bbdfff55, 86vw 48vh #bbdfff66,
        94vw 14vh #bbdfff44, 12vw 91vh #bbdfff55;
      opacity: 0.6;
      animation: drift 18s ease-in-out infinite alternate;
    }

    .stars::after {
      top: 8vh;
      left: 4vw;
      width: 1px;
      height: 1px;
      opacity: 0.35;
      animation-duration: 25s;
      animation-delay: -9s;
    }

    header {
      padding: clamp(28px, 5vw, 64px) clamp(24px, 5vw, 72px);
    }

    h1 {
      position: relative;
      width: fit-content;
      max-width: 100%;
      margin: 0;
      font-size: clamp(28px, 5.5vw, 54px);
      font-weight: 750;
      line-height: 1.2;
      letter-spacing: -0.045em;
      overflow-wrap: anywhere;
      color: #b6dfff;
      background: linear-gradient(110deg, #e0f5ff 5%, #89d9ff 40%, #a9a5ff 75%, #c8afff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 22px #649cff38);
    }

    h1::after {
      content: "";
      position: absolute;
      bottom: -18px;
      left: 2px;
      width: 48px;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, #79d5ff, #9e8aff55, transparent);
      box-shadow: 0 0 12px #79d5ff44;
    }

    main {
      padding: 12px clamp(24px, 5vw, 72px) 64px;
    }

    .game-card {
      width: 100%;
      max-width: 420px;
      padding: clamp(24px, 4vw, 36px);
      border: 1px solid #89d9ff33;
      border-radius: 24px;
      background: linear-gradient(135deg, #143354d9, #101e38e6);
      box-shadow: 0 20px 60px #020a1a40;
    }

    .game-card h2 {
      margin: 0 0 28px;
      color: #e0f5ff;
      font-size: clamp(24px, 4vw, 32px);
      line-height: 1.4;
      letter-spacing: 0.06em;
    }

    .play-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      min-height: 48px;
      padding: 12px 24px;
      border: 1px solid #b6e8ff;
      border-radius: 12px;
      color: #07152d;
      background: linear-gradient(110deg, #a2e2ff, #b8b8ff);
      font-size: 16px;
      font-weight: 650;
      line-height: 1.5;
      text-decoration: none;
    }

    .play-link:hover {
      background: #d3eeff;
    }

    .play-link:focus-visible {
      outline: 3px solid #e0f5ff;
      outline-offset: 5px;
    }

    @keyframes drift {
      from { transform: translateY(0); }
      to { transform: translateY(-18px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .stars::before,
      .stars::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <header>
    <h1>LittleXiaoRan</h1>
  </header>
  <main>
    <article class="game-card" aria-labelledby="game-title">
      <h2 id="game-title">星环突围</h2>
      <a class="play-link" href="/star-ring-breakout/" aria-label="开始游戏：星环突围">
        开始游戏 <span aria-hidden="true">→</span>
      </a>
    </article>
  </main>
</body>
</html>
